<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel admina - podgląd danych</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
    <style>
      .admin-panel {
        max-width: 1100px;
        margin: 0 auto;
        padding: 12px;
      }
      .table-wrap {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .admin-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .admin-links a {
        display: inline-block;
        padding: 10px 12px;
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        background: #fff;
        text-decoration: none;
      }
      @media (max-width: 900px) {
        .admin-panel {
          padding: 10px;
        }
      }
      @media (max-width: 700px) {
        .admin-panel h1 {
          font-size: 1.3rem;
          margin-top: 10px;
        }
        .admin-links a {
          width: 100%;
          min-height: 44px;
          display: flex;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="tresc_strony admin-panel">
      <h1>Panel admina</h1>
      <p>
        Lista plików danych (tylko <code>.json</code> w katalogu
        <code>data/</code>).
      </p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Plik</th>
              <th>Ostatnia modyfikacja</th>
            </tr>
          </thead>
          <tbody>
            {% for f in files %}
            <tr>
              <td>{{ f.path }}</td>
              <td>
                {% if f.mtime %}{{ f.mtime | int | datetimeformat }}{% else %}-{% endif %}
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
      <br />
      <p class="admin-links">
        <a href="{{ url_for('admin_materials') }}">Zarządzaj materiałami i cenami</a>
      </p>
      <p class="admin-links">
        <a href="{{ url_for('admin_obrobki') }}">Zarządzaj obróbkami i ich jednostkami</a>
      </p>
      <a href="/">Powrót</a>
    </div>
  </body>
</html>
